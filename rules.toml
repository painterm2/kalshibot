# Trading rules for kalshibot. Every order passes through kalshibot/risk.py,
# which enforces these limits. See RULES.md for the reasoning behind each one.
# All money values are in US dollars.

[funding]
# New money you give the bot each calendar month. The bot never deposits or
# withdraws on its own; this is the most it will ever treat as new capital.
monthly_budget = 100.00

[losses]
# Hard daily stop: realized losses today plus the worst case of every open
# position can never exceed this. Resets at midnight (timezone below).
# $3 at launch, $5 after the 2026-10-13 growth step, $8 from 2026-10-13 at the owner's request.
daily_loss_limit = 8.00
# Monthly stop: if the month's realized losses reach this, stop until next month.
# Protects winnings carried over from earlier months.
monthly_loss_limit = 100.00
timezone = "America/New_York"

[sizing]
# Fraction of full Kelly to bet. 0.25 gives most of Kelly's growth with far
# less variance and far less damage when the probability estimate is wrong.
kelly_fraction = 0.25
# Most any single order may risk (cost + fees).
max_risk_per_trade = 4.00
# Skip trades whose expected profit after fees is below this, per contract.
min_edge_per_contract = 0.03

[markets]
# "Short-term bets": only markets that close within this many hours.
max_hours_to_close = 48
# Avoid extreme prices, where fees and rounding eat most of the edge.
min_price = 0.05
max_price = 0.95
# Only bet when the bot's (market-blended) chance of winning is at least this.
# Fewer long shots, bigger and safer bets. Set 2026-10-14 at the owner's request.
min_win_probability = 0.70
# At most this many open positions in the same event (correlated outcomes).
max_positions_per_event = 1
# Kalshi categories the bot never trades. You trade sports yourself.
# Markets with no category are skipped too, so nothing slips through.
excluded_categories = ["Sports"]

[fees]
# Kalshi trading fee: ceil(rate * contracts * price * (1 - price)) to the cent.
taker_fee_rate = 0.07

[safety]
# Real money is off until you flip this deliberately. Runs use the demo API.
live_trading = true
# If this file exists, the bot places no new orders.
kill_switch_file = "STOP"
max_orders_per_day = 20
# Hard stop for the whole bot: never let its total P&L (realized, plus the worst
# case of open bets) go below -$10, and create STOP once realized P&L hits -$10.
total_loss_stop = 10.00

# Gold and silver price markets (kalshibot/commodities.py). Same rules as above,
# except these. It has its own ledger and its own daily limit, so weather and
# commodities can each lose at most their own limit in a day; the total loss stop
# in [safety] covers both together.
[commodities]
daily_loss_limit = 5.00
# Raised from 1.00 on 2026-10-14: fewer, larger, higher-probability bets.
max_risk_per_trade = 2.50
max_orders_per_day = 60
# Daily markets close at 5pm New York time, up to about a day ahead.
max_hours_to_close = 30
# Real money since 2026-10-11, at the owner's request (no paper results yet).
live_trading = true
